TYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAW Calisthenics Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        teko: ['Teko', 'sans-serif'],
                        sans: ['Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        rawdark: '#0a0a0a',
                        rawcard: '#141414',
                        rawborder: '#262626',
                        rawaccent: '#facc15', // Beast mode yellow/orange
                        rawred: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #f5f5f5;
        }
        /* Custom scrollbar for raw aesthetic */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rawaccent selection:text-black">

    <!-- TOP HEADER -->
    <header class="border-b border-rawborder bg-rawdark/90 sticky top-0 z-30 backdrop-blur">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="flame" class="w-6 h-6 text-rawaccent"></i>
                <h1 class="font-teko text-3xl tracking-wider text-rawaccent uppercase font-bold">RAW TRACKER</h1>
            </div>
            <div id="header-date" class="text-xs text-neutral-400 font-mono tracking-wider"></div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md mx-auto w-full px-4 py-6 flex-1 flex flex-col">

        <!-- VIEW 1: CALENDAR & TODAY WORKOUT TRIGGER -->
        <section id="view-calendar" class="space-y-6">
            <!-- Calendar Card -->
            <div class="bg-rawcard border border-rawborder p-4 rounded-none shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-neutral-800 text-neutral-400 hover:text-white transition"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <h2 id="calendar-month-year" class="font-teko text-2xl tracking-wide uppercase text-white"></h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-neutral-800 text-neutral-400 hover:text-white transition"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                </div>
                <!-- Weekdays -->
                <div class="grid grid-cols-7 gap-1 text-center font-mono text-xs text-neutral-500 mb-2">
                    <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                </div>
                <!-- Days Grid -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5"></div>
            </div>

            <!-- TODAY'S WORKOUT BUTTON -->
            <button onclick="openTodayWorkout()" class="w-full bg-rawaccent hover:bg-yellow-400 text-black font-teko text-3xl tracking-wider uppercase py-4 transition flex items-center justify-center space-x-2 shadow-lg">
                <i data-lucide="plus-circle" class="w-7 h-7"></i>
                <span>오늘 운동 (TODAY'S WORKOUT)</span>
            </button>
        </section>

        <!-- VIEW 2: BODY PART SELECTION -->
        <section id="view-bodyparts" class="hidden space-y-4">
            <div class="flex items-center justify-between border-b border-rawborder pb-3">
                <button onclick="showView('calendar')" class="text-xs font-mono text-neutral-400 hover:text-white flex items-center space-x-1">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> <span>BACK TO CALENDAR</span>
                </button>
                <span id="selected-date-badge" class="font-mono text-xs bg-neutral-800 text-rawaccent px-2 py-1"></span>
            </div>
            
            <h2 class="font-teko text-3xl uppercase tracking-wider text-white">SELECT BODY PART (부위 선택)</h2>
            
            <div id="bodypart-list" class="grid grid-cols-2 gap-3">
                <!-- Dynamically populated body parts -->
            </div>
        </section>

        <!-- VIEW 3: EXERCISE SELECTION & FAVORITES -->
        <section id="view-exercises" class="hidden space-y-4">
            <div class="flex items-center justify-between border-b border-rawborder pb-3">
                <button onclick="showView('bodyparts')" class="text-xs font-mono text-neutral-400 hover:text-white flex items-center space-x-1">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> <span>SELECT BODY PART</span>
                </button>
                <span id="selected-bp-badge" class="font-mono text-xs bg-neutral-800 text-rawaccent px-2 py-1"></span>
            </div>

            <div class="flex justify-between items-end">
                <h2 id="exercise-list-title" class="font-teko text-3xl uppercase tracking-wider text-white"></h2>
                <button onclick="openCustomExerciseModal()" class="text-xs font-mono bg-neutral-800 hover:bg-neutral-700 text-rawaccent px-3 py-1.5 border border-rawborder">+ 운동 직접 추가</button>
            </div>

            <!-- Exercise List Container (Favorites first) -->
            <div id="exercise-selection-container" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1"></div>
        </section>

        <!-- VIEW 4: SET LOGGING & CALCULATOR / TIMER -->
        <section id="view-logging" class="hidden space-y-4">
            <div class="flex items-center justify-between border-b border-rawborder pb-3">
                <button onclick="backToExercises()" class="text-xs font-mono text-neutral-400 hover:text-white flex items-center space-x-1">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> <span>CHANGE EXERCISE</span>
                </button>
                <span id="logging-exercise-title" class="font-teko text-2xl text-rawaccent uppercase"></span>
            </div>

            <!-- Sets List -->
            <div id="sets-container" class="space-y-2.5 max-h-[45vh] overflow-y-auto"></div>

            <!-- Add Set Button -->
            <button onclick="addNewSet()" class="w-full bg-neutral-900 border border-rawborder hover:border-rawaccent text-neutral-300 font-teko text-2xl uppercase py-2.5 transition flex items-center justify-center space-x-2">
                <i data-lucide="plus" class="w-5 h-5 text-rawaccent"></i> <span>세트 추가 (+ SET)</span>
            </button>

            <!-- Memo Input -->
            <div class="pt-2">
                <label class="block text-xs font-mono text-neutral-400 mb-1">MEMO (운동 메모)</label>
                <textarea id="workout-memo" oninput="saveCurrentMemo(this.value)" placeholder="오늘 수행 느낌이나 메모를 남기세요..." class="w-full bg-neutral-900 border border-rawborder p-2.5 text-sm text-white focus:outline-none focus:border-rawaccent h-20 resize-none"></textarea>
            </div>
        </section>
    </main>

    <!-- CUSTOM EXERCISE MODAL -->
    <div id="modal-custom-exercise" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-rawcard border border-rawborder w-full max-w-sm p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-teko text-2xl text-white uppercase">새 운동 추가 (ADD EXERCISE)</h3>
                <button onclick="closeCustomExerciseModal()" class="text-neutral-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div>
                <label class="block text-xs font-mono text-neutral-400 mb-1">운동 이름 (EXERCISE NAME)</label>
                <input type="text" id="custom-ex-name" placeholder="예: 아치 업, 디클라인 푸시업 등" class="w-full bg-neutral-900 border border-rawborder p-2.5 text-sm text-white focus:outline-none focus:border-rawaccent font-sans">
            </div>
            <div>
                <label class="block text-xs font-mono text-neutral-400 mb-1">기록 방식 (TRACKING TYPE)</label>
                <select id="custom-ex-type" class="w-full bg-neutral-900 border border-rawborder p-2.5 text-sm text-white focus:outline-none focus:border-rawaccent font-sans">
                    <option value="weight_reps">중량 + 횟수 (Weight & Reps)</option>
                    <option value="timer">타이머 (Isometric Hold Timer - 초 단위)</option>
                </select>
            </div>
            <button onclick="saveCustomExercise()" class="w-full bg-rawaccent hover:bg-yellow-400 text-black font-teko text-2xl uppercase py-3 transition">추가하기 (SAVE)</button>
        </div>
    </div>

    <!-- NUMERIC CALCULATOR KEYPAD MODAL -->
    <div id="modal-keypad" class="fixed inset-0 bg-black/85 z-50 hidden flex flex-col justify-end">
        <div class="bg-rawcard border-t border-rawborder p-5 max-w-md mx-auto w-full space-y-4 rounded-t-2xl shadow-2xl animate-in slide-in-from-bottom">
            <div class="flex justify-between items-center border-b border-rawborder pb-2">
                <span id="keypad-title" class="font-teko text-2xl text-rawaccent uppercase">값 입력 (ENTER VALUE)</span>
                <button onclick="closeKeypad()" class="text-neutral-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="bg-neutral-900 border border-rawborder p-4 text-right">
                <div id="keypad-display" class="font-teko text-5xl text-white tracking-widest">0</div>
            </div>
            <!-- Numeric Keypad Grid -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="keypadPress('1')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">1</button>
                <button onclick="keypadPress('2')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">2</button>
                <button onclick="keypadPress('3')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">3</button>
                <button onclick="keypadPress('4')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">4</button>
                <button onclick="keypadPress('5')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">5</button>
                <button onclick="keypadPress('6')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">6</button>
                <button onclick="keypadPress('7')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">7</button>
                <button onclick="keypadPress('8')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">8</button>
                <button onclick="keypadPress('9')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">9</button>
                <button onclick="keypadPress('CLEAR')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-xl text-red-500">CLEAR</button>
                <button onclick="keypadPress('0')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-3xl text-white">0</button>
                <button onclick="keypadPress('BACK')" class="bg-neutral-900 hover:bg-neutral-800 border border-rawborder py-4 font-teko text-xl text-neutral-400">⌫</button>
            </div>
            <button onclick="confirmKeypad()" class="w-full bg-rawaccent hover:bg-yellow-400 text-black font-teko text-3xl uppercase py-3 transition">확인 (CONFIRM)</button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- DATA & PRESETS ---
        const bodyParts = [
            { id: 'chest', name: '가슴 (Chest)', icon: 'shield' },
            { id: 'back', name: '등 (Back)', icon: 'activity' },
            { id: 'shoulders', name: '어깨 (Shoulders)', icon: 'crosshair' },
            { id: 'legs', name: '하체 (Legs)', icon: 'zap' },
            { id: 'biceps', name: '이두 (Biceps)', icon: 'trending-up' },
            { id: 'triceps', name: '삼두 (Triceps)', icon: 'disc' },
            { id: 'abs', name: '복근 (Abs)', icon: 'target' },
            { id: 'cardio', name: '유산소 (Cardio)', icon: 'heart' }
        ];

        const defaultExercises = {
            chest: [
                { name: '푸시업 (Push-up)', type: 'weight_reps' },
                { name: '디클라인 푸시업 (Decline Push-up)', type: 'weight_reps' },
                { name: '딥스 (Dips)', type: 'weight_reps' }
            ],
            back: [
                { name: '풀업 (Pull-up)', type: 'weight_reps' },
                { name: '친업 (Chin-up)', type: 'weight_reps' },
                { name: '인버티드 로우 (Inverted Row)', type: 'weight_reps' }
            ],
            shoulders: [
                { name: '파이크 푸시업 (Pike Push-up)', type: 'weight_reps' },
                { name: '핸드스탠드 푸시업 (Handstand Push-up)', type: 'weight_reps' }
            ],
            legs: [
                { name: '스쿼트 (Squat)', type: 'weight_reps' },
                { name: '불가리안 스플릿 스쿼트 (Bulgarian Split Squat)', type: 'weight_reps' }
            ],
            biceps: [
                { name: '언더그립 친업 (Undergrip Chin-up)', type: 'weight_reps' }
            ],
            triceps: [
                { name: '벤치 딥스 (Bench Dips)', type: 'weight_reps' },
                { name: '클로즈 그립 푸시업 (Close Grip Push-up)', type: 'weight_reps' }
            ],
            abs: [
                { name: '할로우 바디 (Hollow Body Hold)', type: 'timer' },
                { name: '레그 레이즈 (Leg Raise)', type: 'weight_reps' },
                { name: 'L-Sit', type: 'timer' }
            ],
            cardio: [
                { name: '버피 (Burpee)', type: 'weight_reps' },
                { name: '점핑잭 (Jumping Jack)', type: 'timer' }
            ]
        };

        // --- STATE ---
        let currentDate = new Date();
        let selectedDateStr = '';
        let selectedBodyPartId = '';
        let selectedExerciseName = '';
        
        // Keypad target tracking
        let activeKeypadCallback = null;
        let keypadCurrentVal = '';

        // LocalStorage Data Loaders
        function getSavedWorkouts() {
            return JSON.parse(localStorage.getItem('raw_workouts') || '{}');
        }
        function saveWorkoutsData(data) {
            localStorage.setItem('raw_workouts', JSON.stringify(data));
        }
        function getFavorites() {
            return JSON.parse(localStorage.getItem('raw_favorites') || '[]');
        }
        function saveFavorites(favs) {
            localStorage.setItem('raw_favorites', JSON.stringify(favs));
        }
        function getCustomExercises() {
            return JSON.parse(localStorage.getItem('raw_custom_exercises') || '{}');
        }
        function saveCustomExercisesData(ce) {
            localStorage.setItem('raw_custom_exercises', JSON.stringify(ce));
        }

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderDate();
            renderCalendar();
            lucide.createIcons();
        });

        function updateHeaderDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' };
            document.getElementById('header-date').innerText = now.toLocaleDateString('ko-KR', options);
        }

        // --- NAVIGATION & VIEWS ---
        function showView(viewName) {
            document.getElementById('view-calendar').classList.add('hidden');
            document.getElementById('view-bodyparts').classList.add('hidden');
            document.getElementById('view-exercises').classList.add('hidden');
            document.getElementById('view-logging').classList.add('hidden');

            if (viewName === 'calendar') {
                document.getElementById('view-calendar').classList.remove('hidden');
                renderCalendar();
            } else if (viewName === 'bodyparts') {
                document.getElementById('view-bodyparts').classList.remove('hidden');
                renderBodyParts();
            } else if (viewName === 'exercises') {
                document.getElementById('view-exercises').classList.remove('hidden');
                renderExercises();
            } else if (viewName === 'logging') {
                document.getElementById('view-logging').classList.remove('hidden');
                renderLoggingSets();
            }
            lucide.createIcons();
        }

        function openTodayWorkout() {
            const today = new Date();
            selectedDateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            document.getElementById('selected-date-badge').innerText = selectedDateStr;
            showView('bodyparts');
        }

        function selectDateFromCalendar(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('selected-date-badge').innerText = selectedDateStr;
            showView('bodyparts');
        }

        // --- CALENDAR LOGIC ---
        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendar-month-year').innerText = `${year}. ${String(month + 1).padStart(2, '0')}`;
            
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const workouts = getSavedWorkouts();

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // Blank spaces for previous month
            for (let i = 0; i < firstDayIndex; i++) {
                const blank = document.createElement('div');
                blank.className = 'h-12 bg-neutral-900/30 border border-transparent';
                grid.appendChild(blank);
            }

            // Days of month
            for (let day = 1; day <= totalDays; day++) {
                const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasLogged = workouts[dayStr] && Object.keys(workouts[dayStr].exercises || {}).length > 0;

                const dayBtn = document.createElement('button');
                dayBtn.className = `h-12 flex flex-col items-center justify-center border transition relative ${
                    hasLogged ? 'bg-rawcard border-rawaccent text-rawaccent' : 'bg-neutral-900 border-rawborder text-neutral-300 hover:border-neutral-500'
                }`;
                dayBtn.onclick = () => selectDateFromCalendar(dayStr);
                
                dayBtn.innerHTML = `
                    <span class="font-teko text-lg">${day}</span>
                    ${hasLogged ? '<span class="w-1.5 h-1.5 bg-rawaccent rounded-full absolute bottom-1.5"></span>' : ''}
                `;
                grid.appendChild(dayBtn);
            }
        }

        // --- BODY PARTS ---
        function renderBodyParts() {
            const container = document.getElementById('bodypart-list');
            container.innerHTML = '';

            bodyParts.forEach(bp => {
                const btn = document.createElement('button');
                btn.className = 'bg-rawcard border border-rawborder hover:border-rawaccent p-4 text-left transition group flex flex-col justify-between h-24';
                btn.onclick = () => {
                    selectedBodyPartId = bp.id;
                    document.getElementById('selected-bp-badge').innerText = bp.name;
                    showView('exercises');
                };
                btn.innerHTML = `
                    <i data-lucide="${bp.icon}" class="w-6 h-6 text-neutral-400 group-hover:text-rawaccent transition"></i>
                    <span class="font-teko text-2xl uppercase tracking-wider text-white">${bp.name}</span>
                `;
                container.appendChild(btn);
            });
            lucide.createIcons();
        }

        // --- EXERCISES & FAVORITES ---
        function renderExercises() {
            const bpObj = bodyParts.find(b => b.id === selectedBodyPartId);
            document.getElementById('exercise-list-title').innerText = bpObj ? bpObj.name : '';

            const container = document.getElementById('exercise-selection-container');
            container.innerHTML = '';

            const customData = getCustomExercises()[selectedBodyPartId] || [];
            const standardList = defaultExercises[selectedBodyPartId] || [];
            const allExercises = [...customData, ...standardList];
            const favorites = getFavorites();

            // Sort: favorites first
            allExercises.sort((a, b) => {
                const aFav = favorites.includes(a.name) ? 1 : 0;
                const bFav = favorites.includes(b.name) ? 1 : 0;
                return bFav - aFav;
            });

            if (allExercises.length === 0) {
                container.innerHTML = '<p class="text-neutral-500 text-xs font-mono py-4 text-center">등록된 운동이 없습니다. 우측 상단에서 추가하세요.</p>';
                return;
            }

            allExercises.forEach(ex => {
                const isFav = favorites.includes(ex.name);
                const item = document.createElement('div');
                item.className = 'bg-rawcard border border-rawborder p-3.5 flex items-center justify-between hover:border-rawaccent transition';
                
                item.innerHTML = `
                    <div onclick="selectExercise('${ex.name}')" class="flex-1 cursor-pointer">
                        <span class="font-teko text-2xl text-white tracking-wide">${ex.name}</span>
                        <span class="block text-xs font-mono text-neutral-500">${ex.type === 'timer' ? '⏱️ Isometric Timer' : '🏋️ Weight & Reps'}</span>
                    </div>
                    <button onclick="toggleFavorite(event, '${ex.name}')" class="p-2 text-neutral-500 hover:text-rawaccent transition">
                        <i data-lucide="star" class="w-5 h-5 ${isFav ? 'text-rawaccent fill-rawaccent' : ''}"></i>
                    </button>
                `;
                container.appendChild(item);
            });
            lucide.createIcons();
        }

        function toggleFavorite(e, exName) {
            e.stopPropagation();
            let favs = getFavorites();
            if (favs.includes(exName)) {
                favs = favs.filter(f => f !== exName);
            } else {
                favs.push(exName);
            }
            saveFavorites(favs);
            renderExercises();
        }

        function selectExercise(exName) {
            selectedExerciseName = exName;
            document.getElementById('logging-exercise-title').innerText = exName;
            showView('logging');
        }

        // --- CUSTOM EXERCISE MODAL ---
        function openCustomExerciseModal() {
            document.getElementById('modal-custom-exercise').classList.remove('hidden');
        }
        function closeCustomExerciseModal() {
            document.getElementById('modal-custom-exercise').classList.add('hidden');
            document.getElementById('custom-ex-name').value = '';
        }
        function saveCustomExercise() {
            const name = document.getElementById('custom-ex-name').value.trim();
            const type = document.getElementById('custom-ex-type').value;
            if (!name) {
                alert('운동 이름을 입력하세요.');
                return;
            }
            let ce = getCustomExercises();
            if (!ce[selectedBodyPartId]) ce[selectedBodyPartId] = [];
            ce[selectedBodyPartId].push({ name, type });
            saveCustomExercisesData(ce);
            closeCustomExerciseModal();
            renderExercises();
        }

        // --- LOGGING & KEYPAD CALCULATOR ---
        function getExerciseType(exName) {
            for (let bp in defaultExercises) {
                for (let ex of defaultExercises[bp]) {
                    if (ex.name === exName) return ex.type;
                }
            }
            let ce = getCustomExercises();
            for (let bp in ce) {
                for (let ex of ce[bp]) {
                    if (ex.name === exName) return ex.type;
                }
            }
            return 'weight_reps';
        }

        function renderLoggingSets() {
            const workouts = getSavedWorkouts();
            if (!workouts[selectedDateStr]) workouts[selectedDateStr] = { exercises: {}, memos: {} };
            if (!workouts[selectedDateStr].exercises[selectedExerciseName]) {
                workouts[selectedDateStr].exercises[selectedExerciseName] = [];
            }

            const sets = workouts[selectedDateStr].exercises[selectedExerciseName];
            const container = document.getElementById('sets-container');
            container.innerHTML = '';

            const exType = getExerciseType(selectedExerciseName);

            sets.forEach((set, idx) => {
                const row = document.createElement('div');
                row.className = 'bg-rawcard border border-rawborder p-3 flex items-center justify-between gap-2';

                if (exType === 'timer') {
                    row.innerHTML = `
                        <span class="font-teko text-xl text-neutral-400">SET ${idx + 1}</span>
                        <div class="flex items-center space-x-2 flex-1 justify-end">
                            <button onclick="openKeypadForSet(${idx}, 'seconds', ${set.seconds || 0})" class="bg-neutral-900 border border-rawborder px-4 py-2 font-teko text-2xl text-rawaccent min-w-[90px] text-center">${set.seconds || 0} 초</button>
                            <button onclick="deleteSet(${idx})" class="p-2 text-neutral-500 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    `;
                } else {
                    row.innerHTML = `
                        <span class="font-teko text-xl text-neutral-400">SET ${idx + 1}</span>
                        <div class="flex items-center space-x-2 flex-1 justify-end">
                            <button onclick="openKeypadForSet(${idx}, 'weight', ${set.weight || 0})" class="bg-neutral-900 border border-rawborder px-3 py-2 font-teko text-2xl text-white min-w-[80px] text-center">${set.weight || 0} <span class="text-xs font-mono text-neutral-500">kg</span></button>
                            <span class="text-neutral-600">/</span>
                            <button onclick="openKeypadForSet(${idx}, 'reps', ${set.reps || 0})" class="bg-neutral-900 border border-rawborder px-3 py-2 font-teko text-2xl text-rawaccent min-w-[80px] text-center">${set.reps || 0} <span class="text-xs font-mono text-neutral-500">회</span></button>
                            <button onclick="deleteSet(${idx})" class="p-2 text-neutral-500 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    `;
                }
                container.appendChild(row);
            });

            // Memo sync
            document.getElementById('workout-memo').value = workouts[selectedDateStr].memos[selectedExerciseName] || '';
            lucide.createIcons();
        }

        function addNewSet() {
            let workouts = getSavedWorkouts();
            let sets = workouts[selectedDateStr].exercises[selectedExerciseName];
            const exType = getExerciseType(selectedExerciseName);
            
            if (exType === 'timer') {
                sets.push({ seconds: 30 });
            } else {
                const prev = sets.length > 0 ? sets[sets.length - 1] : { weight: 0, reps: 10 };
                sets.push({ weight: prev.weight, reps: prev.reps });
            }
            saveWorkoutsData(workouts);
            renderLoggingSets();
        }

        function deleteSet(idx) {
            let workouts = getSavedWorkouts();
            workouts[selectedDateStr].exercises[selectedExerciseName].splice(idx, 1);
            saveWorkoutsData(workouts);
            renderLoggingSets();
        }

        function saveCurrentMemo(val) {
            let workouts = getSavedWorkouts();
            if (!workouts[selectedDateStr].memos) workouts[selectedDateStr].memos = {};
            workouts[selectedDateStr].memos[selectedExerciseName] = val;
            saveWorkoutsData(workouts);
        }

        function backToExercises() {
            showView('exercises');
        }

        // --- KEYPAD CALCULATOR LOGIC ---
        let currentEditingSetIdx = null;
        let currentEditingField = null;

        function openKeypadForSet(setIdx, field, initialVal) {
            currentEditingSetIdx = setIdx;
            currentEditingField = field;
            keypadCurrentVal = String(initialVal || 0);
            
            document.getElementById('keypad-title').innerText = `${field === 'weight' ? '중량 (kg)' : field === 'reps' ? '횟수 (reps)' : '시간 (seconds)'} 입력`;
            updateKeypadDisplay();
            document.getElementById('modal-keypad').classList.remove('hidden');
        }

        function closeKeypad() {
            document.getElementById('modal-keypad').classList.add('hidden');
        }

        function keypadPress(char) {
            if (char === 'CLEAR') {
                keypadCurrentVal = '0';
            } else if (char === 'BACK') {
                keypadCurrentVal = keypadCurrentVal.length > 1 ? keypadCurrentVal.slice(0, -1) : '0';
            } else {
                if (keypadCurrentVal === '0') {
                    keypadCurrentVal = char;
                } else {
                    keypadCurrentVal += char;
                }
            }
            updateKeypadDisplay();
        }

        function updateKeypadDisplay() {
            document.getElementById('keypad-display').innerText = keypadCurrentVal;
        }

        function confirmKeypad() {
            let workouts = getSavedWorkouts();
            let valNum = parseInt(keypadCurrentVal) || 0;
            workouts[selectedDateStr].exercises[selectedExerciseName][currentEditingSetIdx][currentEditingField] = valNum;
            saveWorkoutsData(workouts);
            closeKeypad();
            renderLoggingSets();
        }
    </script>
</body>
</html>
